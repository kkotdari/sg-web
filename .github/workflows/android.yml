# 스타게이트 안드 앱(android-app/ · Capacitor) 빌드·릴리즈(2026-10-31, 요청: "GitHub Actions 자동" · "깃허브 릴리즈를 화면에서 바로 다운로드").
#
# · 브랜치에 android-app/ 을 고쳐 밀면 — 빌드만(서명 없이 · 내려받을 수 있는 산출물로 남김). 빌드가 깨지지 않았나 보는 몫.
# · Actions 탭 → "Android APK" → Run workflow(버전 이름 입력) — 서명한 APK 를 릴리즈로 올린다(태그 app-v<버전> · '최신').
#   사이트의 앱 설정 '받기'와 앱 안 업데이트는 releases/latest/download/{stargate.apk, version.json} 를 본다.
#
# 비밀값(Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   서명 키스토어(.jks)를 base64 로 — 한 번 만들면 바꾸지 않는다(바뀌면 앱 안 업데이트가 설치를 거부한다)
#   ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
#   GOOGLE_SERVICES_JSON      Firebase 의 google-services.json 내용(날 JSON 또는 base64) — 없으면 푸시 없이 빌드된다
name: Android APK

on:
  push:
    branches-ignore: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "버전 이름 (예: 1.0.0)"
        required: true
      notes:
        description: "업데이트 안내 글(앱의 업데이트 창에 뜬다 · 비워도 됨)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
      VERSION_NAME: ${{ github.event.inputs.version || format('0.0.{0}', github.run_number) }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 사이트 의존성(scplay 재생기) — postinstall 이 public/spr 에 아틀라스를 베낀다
      - name: 사이트 의존성(아틀라스)
        run: npm ci --no-audit --no-fund

      - name: 앱 의존성 · 아틀라스 싣기 · Capacitor sync
        working-directory: android-app
        run: |
          npm ci --no-audit --no-fund
          node scripts/bundle-spr.mjs
          npx cap sync android

      - name: google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then
            case "$GSJ" in
              \{*) printf '%s' "$GSJ" > android-app/android/app/google-services.json ;;
              *) printf '%s' "$GSJ" | base64 -d > android-app/android/app/google-services.json ;;
            esac
            echo "google-services.json 있음 — 푸시 켬"
          else
            echo "::warning::GOOGLE_SERVICES_JSON 비밀값이 없다 — 푸시 없이 빌드"
          fi

      - name: 서명 키스토어
        if: env.RELEASE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 비밀값이 없다 — 릴리즈는 서명이 있어야 한다"; exit 1; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STARGATE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK 빌드
        working-directory: android-app/android
        env:
          STARGATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STARGATE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STARGATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          ls -la app/build/outputs/apk/release/

      - name: 산출물 정리
        run: |
          mkdir -p out
          APK=$(ls android-app/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" out/stargate.apk
          node -e 'const fs=require("fs");fs.writeFileSync("out/version.json",JSON.stringify({versionCode:Number(process.env.VERSION_CODE),versionName:process.env.VERSION_NAME,notes:process.env.NOTES||""})+"\n")'
          ls -la out
        env:
          NOTES: ${{ github.event.inputs.notes }}

      - name: 산출물 올리기(시험 빌드)
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stargate-${{ env.VERSION_NAME }}-unsigned
          path: out/
          retention-days: 7

      - name: 릴리즈
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          TAG="app-v$VERSION_NAME"
          gh release create "$TAG" out/stargate.apk out/version.json \
            --title "스타게이트 앱 $VERSION_NAME" \
            --notes "${NOTES:-스타게이트 안드로이드 앱 $VERSION_NAME}" \
            --target "$GITHUB_SHA" --latest
